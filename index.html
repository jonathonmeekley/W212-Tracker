function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){try{const d=JSON.parse(localStorage.getItem(STORAGE));if(d&&Array.isArray(d.jobs)&&Array.isArray(d.inventory))return upgrade(d)}catch(e){}return clone(defaultData)}
function upgrade(d){d.version=DATA_VERSION;for(const j of defaultData.jobs){const old=d.jobs.find(x=>x.id===j.id);if(!old)d.jobs.push(clone(j));else{for(const k of ['tools','torque','workshopNote','references'])if(j[k]&&!old[k])old[k]=clone(j[k])}}for(const p of defaultData.inventory)if(!d.inventory.some(x=>x.id===p.id))d.inventory.push(clone(p));return d}
let data=load(),activeTab='jobs',inventoryFilter='All';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(STORAGE,JSON.stringify(data));
const jobById=id=>data.jobs.find(j=>j.id===id);
const labels={ongoing:'Ongoing',planned:'Planned',completed:'Completed',ordered:'Ordered',received:'Received',fitted:'Fitted',returned:'Returned'};
function statusClass(s){return 's-'+s}
function renderStats(){const active=data.jobs.filter(j=>j.status!=='completed').length;$('#activeCount').textContent=active;$('#inventoryCount').textContent=data.inventory.length;$('#fittedCount').textContent=data.inventory.filter(p=>p.status==='fitted').reduce((n,p)=>n+Number(p.qty||1),0)}
function jobParts(id){return data.inventory.filter(p=>(p.jobIds||[]).includes(id))}
function matchesSearch(text){const q=$('#search').value.trim().toLowerCase();return !q||String(text).toLowerCase().includes(q)}
function render(){renderStats();$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));$('#filters').innerHTML='';if(activeTab==='jobs')renderJobs(false);if(activeTab==='completed')renderJobs(true);if(activeTab==='inventory')renderInventory()}
function renderJobs(completed){const jobs=data.jobs.filter(j=>(j.status==='completed')===completed).filter(j=>matchesSearch(j.title+' '+j.category+' '+j.note+' '+jobParts(j.id).map(p=>p.name+' '+p.part).join(' ')));const order={ongoing:0,planned:1,completed:2};jobs.sort((a,b)=>(order[a.status]-order[b.status])||a.category.localeCompare(b.category)||a.title.localeCompare(b.title));if(!jobs.length){$('#content').innerHTML='<div class="empty"><strong>No matching jobs</strong>Try a different search.</div>';return}let html='';const groups=[...new Set(jobs.map(j=>j.status))];for(const st of groups){const list=jobs.filter(j=>j.status===st);html+='<div class="group"><div class="groupname">'+esc(labels[st])+' · '+list.length+'</div><div class="cards2">'+list.map(jobCard).join('')+'</div></div>'}$('#content').innerHTML=html}
function referencePanel(j){const refs=Array.isArray(j.references)?j.references:[];if(!refs.length)return '';return '<details class="refdetails"><summary>📘 Reference material</summary><div class="refbody">'+refs.map(r=>'<div class="refcard">'+(r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:inherit"><strong>'+esc(r.label||'Open reference')+'</strong><span>Open source ↗</span></a>':'<strong>'+esc(r.label||'Reference')+'</strong>')+(r.image?'<a href="'+esc(r.url||r.image)+'" target="_blank" rel="noopener noreferrer"><img class="refimage" src="'+esc(r.image)+'" alt="'+esc(r.caption||r.label||'Workshop reference image')+'" loading="lazy"></a>':'')+(r.caption?'<div class="refcaption">'+esc(r.caption)+'</div>':'')+'</div>').join('')+'</div></details>'}
function jobCard(j){const parts=jobParts(j.id),hasDetails=j.tools||j.torque||j.workshopNote;return '<article class="card"><div class="cardtop"><div><div class="title">'+esc(j.title)+'</div><div class="meta">'+esc(j.category)+(j.priority?' · '+esc(j.priority)+' priority':'')+'</div></div><span class="status '+statusClass(j.status)+'">'+esc(labels[j.status])+'</span></div>'+(j.note?'<div class="note">'+esc(j.note)+'</div>':'')+(parts.length?'<div class="chiprow">'+parts.map(p=>'<span class="chip">'+esc(p.name)+(p.qty>1?' ×'+p.qty:'')+'</span>').join('')+'</div>':'<div class="meta" style="margin-top:9px">No parts assigned</div>')+'<details class="jobdetails"><summary>🔩 Tools & torque</summary><div class="jobdetailbody">'+(j.tools?'<div class="detailblock"><strong>Tools required</strong><p>'+esc(j.tools)+'</p></div>':'')+(j.torque?'<div class="detailblock"><strong>Torque specs</strong><p>'+esc(j.torque).replace(/\n/g,'<br>')+'</p></div>':'')+(j.workshopNote?'<div class="detailblock"><strong>Workshop note</strong><p>'+esc(j.workshopNote)+'</p></div>':'')+(!hasDetails?'<div class="meta">No workshop details saved yet. Tap Edit to add tools, torque specs or notes.</div>':'')+'</div></details>'+referencePanel(j)+'<div class="cardactions"><button class="ghost" data-editjob="'+esc(j.id)+'">Edit</button>'+(j.status!=='completed'?'<button class="primary" data-completejob="'+esc(j.id)+'">Mark complete</button>':'<button class="ghost" data-reopenjob="'+esc(j.id)+'">Reopen</button>')+'</div></article>'}
function renderInventory(){const cats=['All',...new Set(data.inventory.map(p=>p.category).sort())];$('#filters').innerHTML='<div class="inventory-filters">'+cats.map(c=>'<button class="filterpill '+(c===inventoryFilter?'active':'')+'" data-invfilter="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>';let parts=data.inventory.filter(p=>inventoryFilter==='All'||p.category===inventoryFilter).filter(p=>matchesSearch(p.name+' '+p.brand+' '+p.part+' '+(p.oe||'')+' '+p.category+' '+p.note));parts.sort((a,b)=>a.category.localeCompare(b.category)||a.name.localeCompare(b.name));if(!parts.length){$('#content').innerHTML='<div class="empty"><strong>No matching parts</strong>Try another category or search.</div>';return}let html='';for(const cat of [...new Set(parts.map(p=>p.category))]){const list=parts.filter(p=>p.category===cat);html+='<div class="group"><div class="groupname">'+esc(cat)+' · '+list.length+'</div><div class="cards2">'+list.map(partCard).join('')+'</div></div>'}$('#content').innerHTML=html}
function partCard(p){const assigned=(p.jobIds||[]).map(jobById).filter(Boolean);const meta=[p.brand,p.part?('Part '+p.part):'',p.oe?('OE '+p.oe):'',p.qty>1?('Qty '+p.qty):''].filter(Boolean).join(' · ');return '<article class="card"><div class="cardtop"><div><div class="title">'+esc(p.name)+'</div><div class="meta">'+esc(meta||p.category)+'</div></div><span class="status '+statusClass(p.status)+'">'+esc(labels[p.status])+'</span></div>'+(p.note?'<div class="note">'+esc(p.note)+'</div>':'')+(assigned.length?'<div class="chiprow">'+assigned.map(j=>'<span class="chip">'+(j.status==='completed'?'✓ ':'')+esc(j.title)+'</span>').join('')+'</div>':'<div class="meta" style="margin-top:9px">Not assigned to a job</div>')+'<div class="partstatus">'+['ordered','received','fitted','returned'].map(s=>'<button class="'+(p.status===s?'active':'')+'" data-partstatus="'+esc(p.id)+':'+s+'">'+labels[s]+'</button>').join('')+'</div><div class="cardactions"><button class="primary" data-assign="'+esc(p.id)+'">Assign to job</button><button class="ghost" data-editpart="'+esc(p.id)+'">Edit</button></div></article>'}
function openSheet(title,body){$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=body;$('#modal').classList.add('show')}
function closeSheet(){$('#modal').classList.remove('show')}
function assignPart(id){const p=data.inventory.find(x=>x.id===id);const jobs=data.jobs.filter(j=>j.status!=='completed');openSheet('Assign “'+p.name+'”','<p class="meta">Choose one or more ongoing or planned jobs.</p>'+jobs.map(j=>'<label class="jobpick"><input type="checkbox" value="'+esc(j.id)+'" '+((p.jobIds||[]).includes(j.id)?'checked':'')+'><span><strong>'+esc(j.title)+'</strong><small>'+esc(labels[j.status])+' · '+esc(j.category)+'</small></span></label>').join('')+'<div class="sheetactions"><button class="primary" id="saveAssign">Save assignment</button></div>');$('#saveAssign').onclick=()=>{p.jobIds=$$('#sheetBody .jobpick input:checked').map(x=>x.value);save();closeSheet();render()}}
function editPart(id){const p=id?data.inventory.find(x=>x.id===id):{id:'part-'+Date.now(),name:'',brand:'',part:'',oe:'',qty:1,category:'Other',status:'ordered',jobIds:[],note:''};openSheet(id?'Edit part':'Add inventory item','<div class="field"><label>Part name</label><input id="pName" value="'+esc(p.name)+'"></div><div class="field"><label>Brand</label><input id="pBrand" value="'+esc(p.brand||'')+'"></div><div class="field"><label>Part number</label><input id="pPart" value="'+esc(p.part||'')+'"></div><div class="field"><label>OE reference</label><input id="pOE" value="'+esc(p.oe||'')+'"></div><div class="field"><label>Quantity</label><input id="pQty" type="number" min="1" value="'+esc(p.qty||1)+'"></div><div class="field"><label>Category</label><input id="pCat" value="'+esc(p.category||'Other')+'"></div><div class="field"><label>Status</label><select id="pStatus">'+['ordered','received','fitted','returned'].map(s=>'<option value="'+s+'" '+(p.status===s?'selected':'')+'>'+labels[s]+'</option>').join('')+'</select></div><div class="field"><label>Notes</label><textarea id="pNote">'+esc(p.note||'')+'</textarea></div><div class="sheetactions">'+(id?'<button class="danger" id="deletePart">Delete</button>':'')+'<button class="primary" id="savePart">Save</button></div>');$('#savePart').onclick=()=>{p.name=$('#pName').value.trim();if(!p.name)return alert('Give the part a name');p.brand=$('#pBrand').value.trim();p.part=$('#pPart').value.trim();p.oe=$('#pOE').value.trim();p.qty=Math.max(1,Number($('#pQty').value)||1);p.category=$('#pCat').value.trim()||'Other';p.status=$('#pStatus').value;p.note=$('#pNote').value.trim();if(!id)data.inventory.push(p);save();closeSheet();render()};if(id)$('#deletePart').onclick=()=>{if(confirm('Delete this inventory item?')){data.inventory=data.inventory.filter(x=>x.id!==id);save();closeSheet();render()}}}
function editJob(id){const j=id?data.jobs.find(x=>x.id===id):{id:'job-'+Date.now(),title:'',category:'Other',status:'planned',priority:'Medium',note:'',tools:'',torque:'',workshopNote:''};openSheet(id?'Edit job':'Add job','<div class="field"><label>Job name</label><input id="jTitle" value="'+esc(j.title)+'"></div><div class="field"><label>Category</label><input id="jCat" value="'+esc(j.category||'Other')+'"></div><div class="field"><label>Status</label><select id="jStatus">'+['ongoing','planned','completed'].map(s=>'<option value="'+s+'" '+(j.status===s?'selected':'')+'>'+labels[s]+'</option>').join('')+'</select></div><div class="field"><label>Priority</label><select id="jPriority">'+['High','Medium','Low',''].map(s=>'<option value="'+s+'" '+(j.priority===s?'selected':'')+'>'+(s||'None')+'</option>').join('')+'</select></div><div class="field"><label>Notes</label><textarea id="jNote">'+esc(j.note||'')+'</textarea></div><div class="field"><label>Tools required</label><textarea id="jTools" placeholder="13 mm socket · E12 · torque wrench">'+esc(j.tools||'')+'</textarea></div><div class="field"><label>Torque specs</label><textarea id="jTorque" placeholder="Fastener: 50 Nm">'+esc(j.torque||'')+'</textarea></div><div class="field"><label>Workshop note</label><textarea id="jWorkshopNote" placeholder="Support gearbox before removing mount…">'+esc(j.workshopNote||'')+'</textarea></div><div class="sheetactions">'+(id?'<button class="danger" id="deleteJob">Delete</button>':'')+'<button class="primary" id="saveJob">Save</button></div>');$('#saveJob').onclick=()=>{j.title=$('#jTitle').value.trim();if(!j.title)return alert('Give the job a name');j.category=$('#jCat').value.trim()||'Other';j.status=$('#jStatus').value;j.priority=$('#jPriority').value;j.note=$('#jNote').value.trim();j.tools=$('#jTools').value.trim();j.torque=$('#jTorque').value.trim();j.workshopNote=$('#jWorkshopNote').value.trim();if(!id)data.jobs.push(j);save();closeSheet();render()};if(id)$('#deleteJob').onclick=()=>{if(confirm('Delete this job? Parts assigned to it will simply become unassigned from this job.')){data.jobs=data.jobs.filter(x=>x.id!==id);data.inventory.forEach(p=>p.jobIds=(p.jobIds||[]).filter(x=>x!==id));save();closeSheet();render()}}}
function settings(){openSheet('Backup & reset','<div class="settingsbox"><button class="primary" id="exportBtn">Export backup</button><button class="ghost" id="importBtn">Import backup</button><input id="importFile" type="file" accept="application/json,.json" hidden><button class="danger" id="resetBtn">Reset to built-in tracker</button></div><p class="meta" style="margin-top:12px">No price history is stored in this version.</p>');$('#exportBtn').onclick=()=>{const b=new Blob([JSON.stringify({...data,exported:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='W212-Workshop-Simple-Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.jobs)||!Array.isArray(d.inventory))throw Error('Invalid backup');data=upgrade(d);save();closeSheet();render();alert('Backup restored')}catch(err){alert('Could not import: '+err.message)}};$('#resetBtn').onclick=()=>{if(confirm('Reset the tracker to the built-in November 2026 data?')){data=clone(defaultData);save();closeSheet();render()}}}

document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.tab){activeTab=t.dataset.tab;inventoryFilter='All';$('#search').value='';render()}if(t.dataset.invfilter){inventoryFilter=t.dataset.invfilter;renderInventory()}if(t.dataset.assign)assignPart(t.dataset.assign);if(t.dataset.editpart)editPart(t.dataset.editpart);if(t.dataset.editjob)editJob(t.dataset.editjob);if(t.dataset.partstatus){const [id,s]=t.dataset.partstatus.split(':');const p=data.inventory.find(x=>x.id===id);if(p){p.status=s;save();render()}}if(t.dataset.completejob){const j=jobById(t.dataset.completejob);if(j){j.status='completed';save();render()}}if(t.dataset.reopenjob){const j=jobById(t.dataset.reopenjob);if(j){j.status='planned';save();render()}}});
$('#search').addEventListener('input',render);$('#closeModal').onclick=closeSheet;$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeSheet()});$('#settingsBtn').onclick=settings;$('#fab').onclick=()=>activeTab==='inventory'?editPart():editJob();
save();render();
</script>
